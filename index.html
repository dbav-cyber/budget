<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">

<title>Mon Budget</title>

<style>
:root {
  --bg:#f6f5f1; --card:#ffffff; --line:#e4e1d8; --line-strong:#cfcabb;
  --ink:#23211c; --ink2:#6b6657; --ink3:#9a9483;
  --green:#3b6d11; --green-bg:#eaf3de; --green-line:#97c459;
  --red:#a32d2d; --red-bg:#fcebeb; --red-line:#f09595;
  --amber:#854f0b; --amber-bg:#faeeda; --amber-line:#ef9f27;
  --blue:#185fa5; --blue-bg:#e6f1fb; --blue-line:#85b7eb;
  --dark-header:#1a1a2e;
  --radius:10px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body.dark {
  --bg:#111318; --card:#1e2028; --line:#2e3040; --line-strong:#3a3d50;
  --ink:#e8e6e0; --ink2:#9a97a8; --ink3:#5a5870;
  --green-bg:#162610; --green-line:#2d5a14;
  --red-bg:#2a1010; --red-line:#5a1a1a;
  --amber-bg:#2a1f08; --amber-line:#5a3a0a;
  --blue-bg:#0d1e35; --blue-line:#1a3a60;
  --dark-header:#0d0f1a;
}
*{box-sizing:border-box;transition:background-color 0.2s,color 0.2s,border-color 0.2s;}
body{margin:0;background:var(--bg);color:var(--ink);padding:20px 12px 90px;}
.wrap{max-width:760px;margin:0 auto;}
h1{font-size:22px;font-weight:600;margin:0 0 4px;}
.sub{color:var(--ink2);font-size:14px;margin:0 0 20px;}
/* Import modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:760px;max-height:90vh;overflow-y:auto;padding:20px 18px 40px;}
.modal h2{font-size:17px;font-weight:700;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center;}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink3);}
.import-drop{border:2px dashed var(--line-strong);border-radius:12px;padding:32px;text-align:center;cursor:pointer;background:var(--bg);margin-bottom:16px;transition:border-color 0.2s;}
.import-drop:hover,.import-drop.drag{border-color:var(--green);}
.import-drop .icon{font-size:40px;margin-bottom:8px;}
.import-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:12px;}
.import-table th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);color:var(--ink2);font-weight:600;}
.import-table td{padding:6px 8px;border-bottom:0.5px solid var(--line);}
.import-table tr.skip td{opacity:0.4;text-decoration:line-through;}
.import-table select{border:0.5px solid var(--line);border-radius:4px;padding:3px 4px;font-size:11px;background:var(--bg);color:var(--ink);}
.tag{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600;}
.tag.debit{background:var(--red-bg);color:var(--red);}
.tag.credit{background:var(--green-bg);color:var(--green);}
.import-btn{background:var(--green);color:#fff;border:none;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;width:100%;margin-top:8px;}
/* Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:0.5px solid var(--line);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0px);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 8px;background:none;border:none;cursor:pointer;font-size:10px;color:var(--ink3);gap:3px;}
.nav-btn .icon{font-size:22px;line-height:1;}
.nav-btn.active{color:var(--green);}
/* Topbar */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:20px;}
.topbar select{flex:1;border:0.5px solid var(--line-strong);background:var(--card);border-radius:var(--radius);padding:8px 12px;font-size:14px;color:var(--ink);cursor:pointer;}
.topbar button{border:0.5px solid var(--line-strong);background:var(--card);border-radius:var(--radius);padding:8px 12px;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap;}
.topbar button:hover{background:var(--line);}
.save-status{font-size:12px;color:var(--ink3);white-space:nowrap;}
/* Health Score */
.health-card{border-radius:14px;padding:16px 18px;margin-bottom:16px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;}
.health-score{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex-shrink:0;}
.health-details{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.health-item{font-size:12px;}
.health-item .hl{color:var(--ink2);margin-bottom:1px;}
.health-item .hv{font-weight:600;font-size:13px;}
/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px;}
.metric{background:var(--card);border:0.5px solid var(--line);border-radius:12px;padding:14px 16px;}
.metric .lbl{font-size:12px;color:var(--ink2);margin-bottom:4px;}
.metric .val{font-size:20px;font-weight:600;}
.metric.pos .val{color:var(--green);}
.metric.neg .val{color:var(--red);}
/* Sections */
section{background:var(--card);border:0.5px solid var(--line);border-radius:12px;padding:16px 14px;margin-bottom:16px;}
section h2{font-size:15px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
/* Budget prévisionnel bar */
.budget-bar{margin-bottom:10px;}
.budget-bar-track{height:5px;background:var(--line);border-radius:3px;overflow:hidden;}
.budget-bar-fill{height:100%;border-radius:3px;transition:width 0.4s;}
.budget-bar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);margin-bottom:3px;}
/* Rows */
.rows{display:flex;flex-direction:column;gap:8px;}
.row{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:nowrap;}
.row input[type=text]{flex:1;min-width:0;border:0.5px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;background:var(--bg);color:var(--ink);}
.row input[type=number]{width:96px;flex-shrink:0;border:0.5px solid var(--line);border-radius:8px;padding:9px 8px;font-size:14px;text-align:right;background:var(--bg);color:var(--ink);}
.row select{flex-shrink:0;max-width:110px;border:0.5px solid var(--line);border-radius:8px;padding:9px 6px;font-size:12px;background:var(--bg);color:var(--ink2);}
.row .del{flex-shrink:0;background:none;border:none;color:var(--ink3);cursor:pointer;font-size:18px;padding:4px 6px;line-height:1;}
.row .del:hover{color:var(--red);}
.copy-btn{flex-shrink:0;background:none;border:none;color:var(--ink3);cursor:pointer;font-size:14px;padding:4px 5px;line-height:1;}
.copy-btn:hover{color:var(--blue);}
.copy-btn.ok{color:var(--green);}
.note-btn{flex-shrink:0;background:none;border:none;cursor:pointer;font-size:13px;padding:4px 5px;line-height:1;color:var(--ink3);}
.note-btn.has-note{color:var(--amber);}
.note-btn:hover{color:var(--blue);}
.note-input{width:100%;border:none;border-top:0.5px solid var(--line);background:var(--amber-bg);border-radius:0 0 8px 8px;padding:6px 10px;font-size:12.5px;color:var(--ink);margin-top:2px;resize:none;}
.row-wrap{display:flex;flex-direction:column;margin-bottom:2px;}
.addrow{margin-top:8px;background:none;border:0.5px dashed var(--line-strong);border-radius:8px;padding:7px 10px;font-size:13px;color:var(--ink2);cursor:pointer;width:100%;text-align:left;}
.addrow:hover{background:var(--line);}
.total{display:flex;justify-content:space-between;border-top:0.5px solid var(--line);margin-top:10px;padding-top:10px;font-size:14px;font-weight:600;}
/* Pills */
.pill{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;}
.pill.green{background:var(--green-bg);color:var(--green);}
.pill.amber{background:var(--amber-bg);color:var(--amber);}
.pill.red{background:var(--red-bg);color:var(--red);}
/* Alerts */
.alert{display:flex;gap:8px;align-items:flex-start;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:16px;}
.alert.ok{background:var(--green-bg);border:0.5px solid var(--green-line);color:var(--green);}
.alert.warn{background:var(--amber-bg);border:0.5px solid var(--amber-line);color:var(--amber);}
.alert.bad{background:var(--red-bg);border:0.5px solid var(--red-line);color:var(--red);}
/* Footer */
.footer{text-align:center;margin-top:24px;}
.reset{font-size:12px;color:var(--ink3);background:none;border:none;cursor:pointer;text-decoration:underline;}
.small{font-size:11.5px;color:var(--ink3);}
.savings-note{font-size:12.5px;color:var(--ink2);margin-top:8px;}
/* Charts */
.chart-section{background:var(--card);border:0.5px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;}
.chart-section h2{font-size:15px;font-weight:600;margin:0 0 14px;}
.chart-wrap{position:relative;height:220px;}
/* Catbar */
.catbreak{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
.catbar-row .top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);margin-bottom:3px;}
.catbar-track{height:6px;background:var(--bg);border-radius:4px;overflow:hidden;}
.catbar-fill{height:100%;background:var(--blue-line);}
/* Epargne */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-box{background:var(--card);border:0.5px solid var(--line);border-radius:10px;padding:12px 14px;}
.stat-box .lbl{font-size:11px;color:var(--ink2);margin-bottom:4px;}
.stat-box .val{font-size:18px;font-weight:600;}
.goal-card{background:var(--green-bg);border:0.5px solid var(--green-line);border-radius:12px;padding:16px 18px;margin-bottom:16px;}
.goal-card h2{font-size:15px;font-weight:600;margin:0 0 10px;color:var(--green);}
.goal-bar{height:10px;background:rgba(0,0,0,0.08);border-radius:5px;overflow:hidden;margin:8px 0;}
.goal-fill{height:100%;background:var(--green);border-radius:5px;transition:width 0.5s;}
.goal-row{display:flex;align-items:center;gap:8px;margin-top:12px;}
.goal-row input{flex:1;border:0.5px solid var(--green-line);border-radius:8px;padding:8px 10px;font-size:14px;background:var(--card);color:var(--ink);}
.goal-row button{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;}
/* Asset cards */
.asset-card{background:var(--bg);border-radius:12px;padding:14px;margin-bottom:10px;}
.asset-history-mini{display:flex;gap:3px;align-items:flex-end;height:28px;margin-top:6px;}
.asset-history-mini .bar{flex:1;background:var(--blue-line);border-radius:2px;min-height:3px;}
/* Login */
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;gap:20px;padding:24px;text-align:center;}
.login-icon{width:72px;height:72px;background:var(--green);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff;}
.login-btn{background:var(--green);color:#fff;border:none;border-radius:10px;padding:14px 28px;font-size:15px;cursor:pointer;font-weight:600;width:100%;max-width:280px;}
/* Dark toggle */
.dark-btn{background:none;border:0.5px solid var(--line-strong);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:16px;color:var(--ink);}
</style>
</head>
<body>
<div class="wrap" id="app">
  <p style="text-align:center;color:var(--ink2);padding:60px 0;">Chargement...</p>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
// ── Firebase ──────────────────────────────────────────────────
const firebaseConfig = {
  apiKey:"AIzaSyA9cuO9GzC1pJfGhKRz7rBZtXqHFUhLU8o",
  authDomain:"budget-92cee.firebaseapp.com",
  projectId:"budget-92cee",
  storageBucket:"budget-92cee.firebasestorage.app",
  messagingSenderId:"518937293108",
  appId:"1:518937293108:web:38012a527a65da64e4f561"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

// ── État ──────────────────────────────────────────────────────
let months={}, currentKey=null, currentUser=null;
let activeTab='budget', darkMode=false;
let savingsGoal=0, assets=[], budgetTargets={}, labelColors={}, copiedMonth=null, passifs=[], copiedSection=null, copiedSectionName=null;
let charts={};

// ── Constantes ────────────────────────────────────────────────
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const COLORS=["#534AB7","#0F6E56","#993C1D","#993556","#185FA5","#3B6D11","#854F0B","#A32D2D","#26215C","#04342C"];
const ASSET_TYPES=["Retraite (PER)","Immobilier","Bourse / ETF","Livret","Crypto","Autre"];
const ASSET_COLORS={"Retraite (PER)":"#534AB7","Immobilier":"#ef9f27","Bourse / ETF":"#3b6d11","Livret":"#85b7eb","Crypto":"#f09595","Autre":"#9a9483"};
const CATEGORIES=["Alimentation","Sorties / loisirs","Shopping","Transport","Santé","Maison","Abonnements","Autre"];

// ── Utilitaires ───────────────────────────────────────────────
const monthLabel=k=>{ const [y,m]=k.split("-"); return MOIS[parseInt(m,10)-1]+" "+y; };
const fmt=n=>{ n=parseFloat(n)||0; return n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+" €"; };
const sum=arr=>arr.reduce((a,b)=>a+(parseFloat(b.montant)||0),0);
const autoColor=label=>{ let h=0; for(const c of (label||'_').toLowerCase()) h=(h*31+c.charCodeAt(0))>>>0; return COLORS[h%COLORS.length]; };
const dotColor=label=>labelColors[label]||autoColor(label);
function setLabelColor(label,color){ labelColors[label]=color; saveSettings(); }

function emptyMonth(solde,epargne){
  return {
    soldeDebut:solde||0,
    revenus:[{label:"Salaire",montant:0}],
    fixes:[{label:"Loyer",montant:0}],
    epargne:[{label:"Epargne",montant:0}],
    cb:[],
    autresVariables:[{label:"Especes",montant:0}],
    miseDeCotePrecedente:epargne||0
  };
}

function copyMonthLines(prev){
  return {
    soldeDebut:0,
    revenus: JSON.parse(JSON.stringify(prev.revenus)),
    fixes:   JSON.parse(JSON.stringify(prev.fixes)),
    epargne: JSON.parse(JSON.stringify(prev.epargne)),
    cb:[], autresVariables:[],
    miseDeCotePrecedente:0
  };
}

function computeTotals(d){
  const soldeDebut=parseFloat(d.soldeDebut)||0;
  const totalRevenusBrut=sum(d.revenus);
  const totalFixes=sum(d.fixes);
  const totalEpargne=sum(d.epargne);
  const totalCB=sum(d.cb);
  const totalAutresVar=sum(d.autresVariables);
  const totalVariable=totalCB+totalAutresVar;
  const resteApresFixe=totalRevenusBrut+soldeDebut-totalFixes-totalEpargne;
  const soldeFin=resteApresFixe-totalVariable;
  const miseDeCoteTotal=(parseFloat(d.miseDeCotePrecedente)||0)+totalEpargne;
  return {totalRevenusBrut,totalFixes,totalEpargne,totalCB,totalAutresVar,totalVariable,resteApresFixe,soldeFin,miseDeCoteTotal};
}

function catBreakdown(cb){
  const map={};
  cb.forEach(i=>{ const c=i.categorie||"Non cat."; map[c]=(map[c]||0)+(parseFloat(i.montant)||0); });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}

function computeAssetValue(asset){
  const initial=parseFloat(asset.initialValue)||0;
  if(!asset.linkedLabel) return {current:parseFloat(asset.value)||0,added:0};
  let added=0;
  Object.values(months).forEach(m=>{
    m.epargne.forEach(line=>{
      if((line.label||'').trim().toLowerCase()===(asset.linkedLabel||'').trim().toLowerCase())
        added+=parseFloat(line.montant)||0;
    });
  });
  return {current:initial+added,added};
}

function healthScore(d,t){
  let score=100;
  const txEpargne=t.totalRevenusBrut>0?t.totalEpargne/t.totalRevenusBrut:0;
  const txFixes=t.totalRevenusBrut>0?t.totalFixes/t.totalRevenusBrut:0;
  if(txEpargne<0.05) score-=25;
  else if(txEpargne<0.10) score-=10;
  if(txFixes>0.60) score-=20;
  else if(txFixes>0.45) score-=10;
  if(t.soldeFin<0) score-=30;
  else if(t.soldeFin<100) score-=10;
  if((parseFloat(d.soldeDebut)||0)<0) score-=15;
  return Math.max(0,Math.min(100,score));
}

// ── Dark mode ─────────────────────────────────────────────────
function toggleDark(){
  darkMode=!darkMode;
  document.body.classList.toggle('dark',darkMode);
  localStorage.setItem('dark',darkMode?'1':'0');
}
function initDark(){ darkMode=localStorage.getItem('dark')==='1'; document.body.classList.toggle('dark',darkMode); }
initDark();

// ── Auth ──────────────────────────────────────────────────────
auth.onAuthStateChanged(user=>{ if(user){currentUser=user;loadData();}else{currentUser=null;showLogin();} });

function showLogin(){
  const isHttps = location.protocol === 'https:' || location.protocol === 'http:';
  document.getElementById('app').innerHTML = isHttps ? `
    <div class="login-screen">
      <div class="login-icon">&#8364;</div>
      <h1>Mon Budget</h1>
      <p style="color:var(--ink2);margin:0;max-width:280px;">Connecte-toi pour synchroniser ton budget sur tous tes appareils.</p>
      <button class="login-btn" onclick="loginGoogle()">Continuer avec Google</button>
      <p style="color:var(--red);font-size:13px;display:none;" id="login-error"></p>
    </div>` : `
    <div class="login-screen">
      <div class="login-icon" style="background:var(--amber);">&#9888;</div>
      <h1>Ouvre l'app via Netlify</h1>
      <p style="color:var(--ink2);margin:0;max-width:300px;">L'app ne peut pas fonctionner depuis un fichier local. Ouvre-la via ton URL Netlify.</p>
      <a href="https://velvety-eclair-a824de.netlify.app" style="background:var(--green);color:#fff;border:none;border-radius:10px;padding:14px 28px;font-size:15px;font-weight:600;text-decoration:none;margin-top:8px;">
        Ouvrir l'app
      </a>
    </div>`;
}

function loginGoogle(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(e=>{
    if(e.code === 'auth/operation-not-supported-in-this-environment' || e.code === 'auth/popup-blocked'){
      // Fallback: redirect
      auth.signInWithRedirect(provider);
    } else {
      const el=document.getElementById('login-error');
      if(el){el.style.display='block';el.textContent='Erreur : '+e.message;}
    }
  });
}

// Handle redirect result on page load
auth.getRedirectResult().then(result=>{
  if(result && result.user){ currentUser=result.user; loadData(); }
}).catch(e=>console.warn('Redirect result:', e));

// ── Firebase data ─────────────────────────────────────────────
async function loadData(){
  document.getElementById('app').innerHTML='<p style="text-align:center;color:var(--ink2);padding:60px 0;">Chargement de tes donnees...</p>';
  try{
    const snap=await db.collection("budgets").doc(currentUser.uid).collection("data").doc("months").get();
    if(snap.exists) months=snap.data().months||{};
    else months={};
    const sg=await db.collection("budgets").doc(currentUser.uid).collection("data").doc("settings").get();
    if(sg.exists){ savingsGoal=sg.data().savingsGoal||0; assets=sg.data().assets||[]; budgetTargets=sg.data().budgetTargets||{}; labelColors=sg.data().labelColors||{}; passifs=sg.data().passifs||[]; }
  }catch(e){
    console.error("Erreur chargement Firebase:",e);
    document.getElementById('app').innerHTML=`
      <div style="text-align:center;padding:60px 24px;">
        <div style="font-size:40px;margin-bottom:16px;">&#9888;</div>
        <h2>Impossible de charger tes donnees</h2>
        <p style="color:var(--ink2);">Verifie que les regles Firestore autorisent la lecture.<br>Code erreur : ${e.code||e.message}</p>
        <button onclick="loadData()" style="background:var(--green);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;cursor:pointer;margin-top:16px;">Reessayer</button>
        <p style="font-size:12px;color:var(--ink3);margin-top:12px;">Si le probleme persiste, verifie dans Firebase Console > Firestore > Regles que la lecture est autorisee pour ton utilisateur.</p>
      </div>`;
    return;
  }
  const keys=Object.keys(months).sort();
  if(!keys.length){
    const now=new Date();
    const k=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
    months[k]=emptyMonth(0,0); currentKey=k;
  } else { currentKey=keys[keys.length-1]; }
  render();
}

let _saveTimer=null;
let _lastSaved=null;

function save(){
  clearTimeout(_saveTimer);
  showSaveStatus('pending');
  _saveTimer=setTimeout(()=>_doSave(),800);
}

async function _doSave(){
  if(!currentUser) return;
  showSaveStatus('saving');
  try{
    await db.collection("budgets").doc(currentUser.uid).collection("data").doc("months").set({months});
    _lastSaved=new Date();
    showSaveStatus('saved');
  }catch(e){
    console.error(e);
    showSaveStatus('error');
  }
}
async function saveSettings(){
  if(!currentUser) return;
  try{ await db.collection("budgets").doc(currentUser.uid).collection("data").doc("settings").set({savingsGoal,assets,budgetTargets,labelColors,passifs}); }catch(e){}
}

function showSaveStatus(s){
  const el=document.getElementById('save-status');
  if(!el) return;
  if(s==='pending'){el.innerHTML='<span style="opacity:0.5">&#9679; En attente...</span>';el.style.color='var(--ink3)';}
  else if(s==='saving'){el.innerHTML='&#9651; Sync...';el.style.color='var(--ink3)';}
  else if(s==='saved'){
    const t=_lastSaved?_lastSaved.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'';
    el.innerHTML='&#9989; Sync '+t;el.style.color='var(--green)';
    setTimeout(()=>{if(el)el.innerHTML='';},4000);
  }
  else{el.innerHTML='&#10060; Erreur sync - verifie ta connexion';el.style.color='var(--red)';}
}

// ── Navigation ────────────────────────────────────────────────
function switchTab(tab){ Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}}); charts={}; activeTab=tab; render(); }
function changeMonth(k){ currentKey=k; render(); }

function addNewMonth(){
  const keys=Object.keys(months).sort();
  const [y,m]=keys[keys.length-1].split("-").map(Number);
  let ny=y,nm=m+1; if(nm>12){nm=1;ny++;}
  const nk=ny+"-"+String(nm).padStart(2,"0");
  if(!months[nk]){
    const prevData=months[keys[keys.length-1]];
    const prevTotals=computeTotals(prevData);
    const newM=copyMonthLines(prevData);
    newM.soldeDebut=prevTotals.soldeFin;
    newM.miseDeCotePrecedente=prevTotals.miseDeCoteTotal;
    months[nk]=newM;
    save();
  }
  currentKey=nk; render();
}

function toggleNote(id){
  const el=document.getElementById(id);

function updateField(section,idx,field,value){ months[currentKey][section][idx][field]=value; save(); }

function copyRow(label,montant,btn){
  const text=label+' : '+(parseFloat(montant)||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' EUR';

function exportData(){
  const a=document.createElement('a');

function importData(input){
  const file=input.files[0]; if(!file) return;

  r.onload=async e=>{ try{ months=JSON.parse(e.target.result); const keys=Object.keys(months).sort(); currentKey=keys[keys.length-1]; await save(); render(); }catch(err){alert("Fichier invalide.");} };
  r.readAsText(file); input.value="";
}

function updateAsset(id,field,value){
  const a=assets.find(x=>x.id===id); if(!a) return;
  a[field]=(['value','initialValue','perf'].includes(field))?(parseFloat(value)||0):value;
}
function snapshotAsset(id){
  const a=assets.find(x=>x.id===id); if(!a) return;
  const val=a.linkedLabel?computeAssetValue(a).current:(parseFloat(a.value)||0);
  if(!a.history) a.history=[];
  a.history.push({date:new Date().toISOString().slice(0,10),value:val});

}

  const target=budgetTargets[targetKey]||0;

  const pct=Math.min(100,Math.round(spent/target*100));
  const over=spent>target;
  const color=over?'var(--red)':pct>80?'var(--amber)':'var(--green)';
  return `<div class="budget-bar">
    <div class="budget-bar-label">
      <span>${label}</span>
      <span style="color:${color};font-weight:600;">${fmt(spent)} / ${fmt(target)}</span>
    </div>
    <div class="budget-bar-track"><div class="budget-bar-fill" style="width:${pct}%;background:${color};"></div></div>
  </div>`;
}

const PASSIF_TYPES=["Credit conso","Credit auto","Pret immobilier","Decouvert","Autre"];

function deletePassif(id){ passifs=passifs.filter(p=>p.id!==id); saveSettings(); render(); }
function updatePassif(id,field,value){
  const p=passifs.find(x=>x.id===id); if(!p) return;
  p[field]=['montant','mensualite'].includes(field)?(parseFloat(value)||0):value;
}

// ── ONGLET ANALYSE ────────────────────────────────────────────
function renderAnalyse(){
  const keys=Object.keys(months).sort();
  const currentYear=currentKey.split('-')[0];
  const yearKeys=keys.filter(k=>k.startsWith(currentYear));
  const allYears=[...new Set(keys.map(k=>k.split('-')[0]))];

  // Totaux annuels
  const yearTotals=yearKeys.map(k=>{
    const t=computeTotals(months[k]);
    return {key:k,label:monthLabel(k),...t};
  });
  const sumRevenu=yearTotals.reduce((s,t)=>s+t.totalRevenusBrut,0);
  const sumFixes=yearTotals.reduce((s,t)=>s+t.totalFixes,0);
  const sumEpargne=yearTotals.reduce((s,t)=>s+t.totalEpargne,0);
  const sumCB=yearTotals.reduce((s,t)=>s+t.totalCB,0);
  const sumVar=yearTotals.reduce((s,t)=>s+t.totalAutresVar,0);
  const sumDepenses=yearTotals.reduce((s,t)=>s+t.totalFixes+t.totalVariable,0);

  // Projection (moyenne 3 derniers mois)
  const last3keys=keys.slice(-3);
  const avgRevenu=last3keys.reduce((s,k)=>s+computeTotals(months[k]).totalRevenusBrut,0)/Math.max(last3keys.length,1);
  const avgEpargne=last3keys.reduce((s,k)=>s+computeTotals(months[k]).totalEpargne,0)/Math.max(last3keys.length,1);
  const avgSolde=last3keys.reduce((s,k)=>s+computeTotals(months[k]).soldeFin,0)/Math.max(last3keys.length,1);
  const avgDepenses=last3keys.reduce((s,k)=>s+computeTotals(months[k]).totalFixes+computeTotals(months[k]).totalVariable,0)/Math.max(last3keys.length,1);
  const lastMiseDeCote=keys.length?computeTotals(months[keys[keys.length-1]]).miseDeCoteTotal:0;
  const projMonths=[1,2,3,4,5,6].map(n=>({
    n, epargne:lastMiseDeCote+avgEpargne*n, solde:avgSolde
  }));

  // Tendances CB par categorie
  const cbTrends={};
  keys.forEach(k=>{
    months[k].cb.forEach(item=>{
      const cat=item.categorie||"Non cat.";
      if(!cbTrends[cat]) cbTrends[cat]=[];
      // find or create entry for this month
      const existing=cbTrends[cat].find(e=>e.key===k);
      if(existing) existing.val+=parseFloat(item.montant)||0;
      else cbTrends[cat].push({key:k,label:monthLabel(k),val:parseFloat(item.montant)||0});
    });
  });
  // Pad missing months with 0
  Object.keys(cbTrends).forEach(cat=>{
    keys.forEach(k=>{ if(!cbTrends[cat].find(e=>e.key===k)) cbTrends[cat].push({key:k,label:monthLabel(k),val:0}); });
    cbTrends[cat].sort((a,b)=>a.key.localeCompare(b.key));
  });
  const topCats=Object.entries(cbTrends).sort((a,b)=>b[1].reduce((s,e)=>s+e.val,0)-a[1].reduce((s,e)=>s+e.val,0)).slice(0,5);

  // Passifs
  const totalPassifs=passifs.reduce((s,p)=>s+(parseFloat(p.montant)||0),0);
  const totalActifs=assets.reduce((s,a)=>{ const v=a.linkedLabel?computeAssetValue(a).current:(parseFloat(a.value)||0); return s+v; },0);
  const patrimoineNet=totalActifs-totalPassifs;

  document.getElementById('app').innerHTML=`

      </div>

      <!-- SELECTEUR ANNEE -->
      <div class="topbar" style="margin-bottom:20px;">
        <select onchange="window._analyseYear=this.value;renderAnalyse();">
          ${allYears.map(y=>`<option value="${y}" ${y===currentYear?'selected':''}>${y}</option>`).join('')}
        </select>
      </div>

      <!-- RECAPITULATIF ANNUEL -->
      <section>
        <h2>Recapitulatif ${currentYear}</h2>
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;font-size:12.5px;">
            <thead>
              <tr style="border-bottom:1px solid var(--line);color:var(--ink2);">
                <th style="text-align:left;padding:6px 4px;">Mois</th>
                <th style="text-align:right;padding:6px 4px;">Recettes</th>
                <th style="text-align:right;padding:6px 4px;">Depenses</th>
                <th style="text-align:right;padding:6px 4px;">Epargne</th>
                <th style="text-align:right;padding:6px 4px;">Solde fin</th>
              </tr>
            </thead>
            <tbody>
              ${yearTotals.map(t=>`
                <tr style="border-bottom:0.5px solid var(--line);cursor:pointer;" onclick="currentKey='${t.key}';switchTab('budget');">
                  <td style="padding:7px 4px;font-weight:500;">${t.label}</td>
                  <td style="text-align:right;padding:7px 4px;color:var(--green);">${fmt(t.totalRevenusBrut)}</td>
                  <td style="text-align:right;padding:7px 4px;color:var(--red);">${fmt(t.totalFixes+t.totalVariable)}</td>
                  <td style="text-align:right;padding:7px 4px;color:var(--blue);">${fmt(t.totalEpargne)}</td>
                  <td style="text-align:right;padding:7px 4px;font-weight:600;color:${t.soldeFin>=0?'var(--green)':'var(--red)'};">${fmt(t.soldeFin)}</td>
                </tr>`).join('')}
            </tbody>
            <tfoot>
              <tr style="border-top:1.5px solid var(--line-strong);font-weight:700;">
                <td style="padding:8px 4px;">TOTAL</td>
                <td style="text-align:right;padding:8px 4px;color:var(--green);">${fmt(sumRevenu)}</td>
                <td style="text-align:right;padding:8px 4px;color:var(--red);">${fmt(sumDepenses)}</td>
                <td style="text-align:right;padding:8px 4px;color:var(--blue);">${fmt(sumEpargne)}</td>
                <td style="text-align:right;padding:8px 4px;"></td>
              </tr>
            </tfoot>
          </table>
        </div>
        <div class="chart-wrap" style="margin-top:16px;"><canvas id="c-annual"></canvas></div>
      </section>

      <!-- PROJECTION 6 MOIS -->
      <section>
        <h2>Projection 6 mois</h2>
        <p class="small">Basee sur la moyenne de tes ${last3keys.length} derniers mois.</p>
        <div class="stat-grid">
          <div class="stat-box"><div class="lbl">Recettes moy./mois</div><div class="val">${fmt(avgRevenu)}</div></div>

let importRows = [];

function openImport(){
  const existing = document.getElementById('import-modal');
  if(existing) existing.remove();
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'import-modal';
  modal.innerHTML = `
    <div class="modal">
      <h2>Importer un releve bancaire <button class="modal-close" onclick="document.getElementById('import-modal').remove()">x</button></h2>
      <div class="import-drop" id="drop-zone" onclick="document.getElementById('file-input-import').click()">
        <div class="icon">&#128196;</div>
        <div style="font-weight:600;margin-bottom:6px;">Glisse ton releve ici ou clique</div>
        <div style="font-size:12.5px;color:var(--ink2);">CSV (BoursoBank, LCL, CIC, BNP, Revolut...) ou PDF</div>
        <input type="file" id="file-input-import" accept=".csv,.pdf,.txt" style="display:none" onchange="handleImportFile(this.files[0])">
      </div>
      <div id="import-preview"></div>
    </div>`;
  modal.addEventListener('dragover', e=>{ e.preventDefault(); document.getElementById('drop-zone').classList.add('drag'); });
  modal.addEventListener('dragleave', ()=>document.getElementById('drop-zone').classList.remove('drag'));
  modal.addEventListener('drop', e=>{ e.preventDefault(); document.getElementById('drop-zone').classList.remove('drag'); handleImportFile(e.dataTransfer.files[0]); });
  modal.addEventListener('click', e=>{ if(e.target===modal) modal.remove(); });
  document.body.appendChild(modal);
}

async function handleImportFile(file){
  if(!file) return;
  const preview = document.getElementById('import-preview');
  preview.innerHTML = '<p style="color:var(--ink2);text-align:center;padding:20px;">Analyse en cours...</p>';
  try{
    let rows = [];
    const name = file.name.toLowerCase();
    if(name.endsWith('.pdf')){
      rows = await parsePDF(file);
    } else {
      let text = '';
      try { text = await file.text(); } catch(e){ text = await readWithEncoding(file, 'iso-8859-1'); }
      rows = parseCSV(text);
    }
    if(!rows.length){
      preview.innerHTML = '<div style="text-align:center;padding:20px;"><div style="font-size:32px;">&#129300;</div><p style="color:var(--red);font-weight:600;">Aucune transaction detectee</p><p style="font-size:13px;color:var(--ink2);">Verifie que le fichier est un export CSV de ta banque. Essaie de l\'exporter depuis ton espace bancaire en ligne.</p></div>';
      return;
    }
    importRows = rows;
    renderImportPreview();
  } catch(e){
    preview.innerHTML = `<p style="color:var(--red);padding:12px;">Erreur : ${e.message}</p>`;
    console.error(e);
  }
}

function readWithEncoding(file, encoding){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsText(file,encoding); });
}

function parseCSV(text){
  text = text.replace(/^\uFEFF/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const lines = text.split('\n');
  let startLine = 0;
  for(let i=0;i<Math.min(15,lines.length);i++){
    if(lines[i].match(/\d{2}[\/\.\-]\d{2}[\/\.\-]\d{2,4}/) || lines[i].match(/^\d{4}-\d{2}-\d{2}/)){
      startLine = i; break;
    }
  }
  const sampleLine = lines[startLine]||lines[0]||'';
  const sep = sampleLine.split(';').length > sampleLine.split(',').length ? ';' : ',';
  let headerLine = startLine > 0 ? startLine-1 : 0;
  // Find actual header (line with text labels)
  for(let i=Math.max(0,startLine-3);i<=startLine;i++){
    if(lines[i] && /date|libel|label|descri|montant|debit|credit|amount/i.test(lines[i])){ headerLine=i; break; }
  }
  const headers = (lines[headerLine]||'').split(sep).map(h=>h.replace(/^["']/,'').replace(/["']$/,'').trim().toLowerCase());
  const iDate   = findCol(headers,['date','datum','jour']);
  const iLabel  = findCol(headers,['libelle','label','description','intitule','operation','wording','nom','objet','detail','reference','beneficiaire','tiers','motif']);
  const iAmount = findCol(headers,['montant','amount','valeur','somme']);
  const iDebit  = findCol(headers,['debit','sortie','paiement','charge']);
  const iCredit = findCol(headers,['credit','entree','recette','encaissement','versement']);

  const rows = [];
  for(let i=startLine;i<lines.length;i++){
    const line = lines[i].trim();
    if(!line) continue;
    const cols = splitCSVLine(line, sep);
    if(cols.length < 2) continue;
    let date = iDate>=0 ? cols[iDate] : '';
    let label = iLabel>=0 ? cols[iLabel] : cols.find(c=>c.length>3 && !/^[0-9,.\- ]+$/.test(c))||'';
    label = label.replace(/^["']|["']$/g,'').trim();
    if(!label || label === lines[headerLine].split(sep)[iLabel]) continue;
    let amount = 0;
    let isDebit = true;

    if(iDebit>=0 || iCredit>=0){
      // Colonnes debit et credit separees (LCL, CIC, CA, BNP...)
      const debitStr  = iDebit>=0  ? (cols[iDebit]||'').replace(/\s/g,'')  : '';
      const creditStr = iCredit>=0 ? (cols[iCredit]||'').replace(/\s/g,'') : '';
      const debit  = debitStr  && debitStr!==''  ? parseMontant(debitStr)  : 0;
      const credit = creditStr && creditStr!=='' ? parseMontant(creditStr) : 0;
      if(credit > 0 && debit === 0){
        amount = credit; isDebit = false; // Entree (salaire, remboursement...)
      } else if(debit > 0 && credit === 0){
        amount = debit;  isDebit = true;  // Sortie (achat, prelevement...)
      } else if(credit > 0){
        amount = credit; isDebit = false;
      } else {
        amount = debit;  isDebit = true;
      }
    } else if(iAmount>=0 && cols[iAmount]){
      // Colonne montant unique (BoursoBank, Revolut...)
      // Negatif = sortie, positif = entree
      const raw = parseMontant(cols[iAmount]);
      if(raw < 0){ amount = Math.abs(raw); isDebit = true; }
      else        { amount = raw;          isDebit = false; }
    } else {
      // Fallback: cherche un nombre dans la ligne
      const nums = cols.filter(c=>c.trim() && /^-?[\d\s,.]+$/.test(c.trim()));
      if(nums.length){
        const raw = parseMontant(nums[nums.length-1]);
        if(raw < 0){ amount = Math.abs(raw); isDebit = true; }
        else        { amount = raw;          isDebit = raw > 0 ? false : true; }
      }
    }

    if(amount === 0 && !/\d/.test(line)) continue;
    date = normalizeDate(date);
    // Categorie auto : si entree, mettre "Salaire" ou autre
    const cat = isDebit ? guessCategory(label) : guessCreditCategory(label);
    rows.push({date, label, amount, categorie:cat, skip:false, editLabel:label, editAmount:amount, isDebit});
  }
  return rows;
}

function findCol(headers, keywords){
  for(const kw of keywords){ const idx=headers.findIndex(h=>h.includes(kw)); if(idx>=0) return idx; }
  return -1;
}

function splitCSVLine(line, sep){
  const result=[]; let cur='', inQ=false;
  for(const ch of line){
    if(ch==='"'||ch==="'") inQ=!inQ;
    else if(ch===sep&&!inQ){ result.push(cur.trim()); cur=''; }
    else cur+=ch;
  }
  result.push(cur.trim());
  return result;
}

function parseMontant(str){
  if(!str||!str.trim()) return 0;
  let s = str.replace(/[€$£\s\u00A0]/g,'').trim();
  if(/\d[.,]\d{3}[.,]\d{2}$/.test(s)) s=s.replace(/[.,](\d{3})[.,]/,'$1.');
  else s=s.replace(/\.(\d{3})(?=,)/,'$1').replace(',','.');
  return parseFloat(s)||0;
}

function normalizeDate(str){
  if(!str) return '';
  let m=str.match(/(\d{2})[\/\.\-](\d{2})[\/\.\-](\d{4})/);
  if(m) return `${m[1]}/${m[2]}/${m[3]}`;
  m=str.match(/(\d{4})[\/\.\-](\d{2})[\/\.\-](\d{2})/);
  if(m) return `${m[3]}/${m[2]}/${m[1]}`;
  return str.slice(0,10);
}

async function parsePDF(file){
  if(typeof pdfjsLib==='undefined') throw new Error('PDF.js non charge - verifie ta connexion.');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;

  // Extraire tous les items texte avec leurs positions X,Y
  let allItems=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    const vp=page.getViewport({scale:1});
    const pageH=vp.height;
    tc.items.forEach(item=>{
      const x=Math.round(item.transform[4]);
      const y=Math.round(pageH-item.transform[5]); // Inverser Y (haut=0)
      const text=(item.str||'').trim();
      if(text) allItems.push({text,x,y,page:p});
    });
  }

  // Grouper par ligne (Y similaire, tolérance 4px)
  allItems.sort((a,b)=>a.y!==b.y?a.y-b.y:a.x-b.x);
  const lineGroups=[];
  let curLine=null;
  for(const item of allItems){
    if(!curLine||Math.abs(item.y-curLine.y)>5){
      curLine={y:item.y, items:[]};
      lineGroups.push(curLine);
    }
    curLine.items.push(item);
  }

  // Détecter colonnes Débit/Crédit depuis l'en-tête
  let xDebit=-1, xCredit=-1;
  for(const line of lineGroups){
    const texts=line.items.map(i=>i.text.toLowerCase());
    const iD=texts.findIndex(t=>t.includes('débit')||t.includes('debit'));
    const iC=texts.findIndex(t=>t.includes('crédit')||t.includes('credit'));
    if(iD>=0&&iC>=0){
      xDebit=line.items[iD].x;
      xCredit=line.items[iC].x;
      break;
    }
  }
  // Fallback si pas d'en-tête trouvé: estimer d'après la largeur
  if(xDebit<0||xCredit<0){
    const maxX=Math.max(...allItems.map(i=>i.x));
    xDebit=maxX*0.68; xCredit=maxX*0.82;
  }
  const colTol=50; // Tolérance colonne en points

  // Construire les transactions
  const dateRe=/^\d{1,2}[\/\.\-]\d{1,2}[\/\.\-]\d{2,4}$/;
  const amtRe=/^-?\d{1,3}(?:[.,]\d{3})*[.,]\d{2}$/;
  const rows=[];
  let curTx=null;

  for(const line of lineGroups){
    const firstItem=line.items[0];
    const lineText=line.items.map(i=>i.text).join(' ');

    // Nouvelle transaction si la ligne commence par une date
    if(firstItem && dateRe.test(firstItem.text)){
      if(curTx&&curTx.label) rows.push(curTx);
      // Trouver débit/crédit sur cette ligne
      let debitAmt=0, creditAmt=0;
      for(const item of line.items){
        const cleanAmt=item.text.replace(/\s/g,'').replace(',','.');
        if(!amtRe.test(item.text.replace(',','.'))&&!amtRe.test(cleanAmt)) continue;
        const val=parseMontant(item.text);
        if(Math.abs(item.x-xDebit)<colTol) debitAmt=Math.abs(val);
        else if(Math.abs(item.x-xCredit)<colTol) creditAmt=Math.abs(val);
      }
      // Label = tous les items non-date et non-montant sur cette ligne
      const label=line.items.filter(i=>{
        if(dateRe.test(i.text)) return false;
        const cleanAmt=i.text.replace(/\s/g,'').replace(',','.');
        if(amtRe.test(i.text.replace(',','.'))|| amtRe.test(cleanAmt)) return false;
        return true;
      }).map(i=>i.text).join(' ').trim();

      const isDebit=debitAmt>0;
      const amount=isDebit?debitAmt:creditAmt;
      curTx={
        date:normalizeDate(firstItem.text),
        label, amount, isDebit,
        debitAmt, creditAmt,
        categorie: isDebit?guessCategory(label):guessCreditCategory(label),
        skip:false, editLabel:label, editAmount:amount
      };
    } else if(curTx){
      // Ligne de continuation du libellé
      // Vérifier si des montants apparaissent sur cette ligne
      let debitAmt=0, creditAmt=0;
      for(const item of line.items){
        const cleanAmt=item.text.replace(/\s/g,'').replace(',','.');
        if(!amtRe.test(item.text.replace(',','.'))&&!amtRe.test(cleanAmt)) continue;
        const val=parseMontant(item.text);
        if(Math.abs(item.x-xDebit)<colTol) debitAmt=Math.abs(val);
        else if(Math.abs(item.x-xCredit)<colTol) creditAmt=Math.abs(val);
      }
      if(debitAmt>0||creditAmt>0){
        // Montants trouvés sur une ligne de continuation
        if(!curTx.amount){
          curTx.isDebit=debitAmt>0;
          curTx.amount=debitAmt||creditAmt;
          curTx.editAmount=curTx.amount;
          curTx.categorie=curTx.isDebit?guessCategory(curTx.label):guessCreditCategory(curTx.label);
        }
      } else {
        // Ajouter au libellé si c'est du texte pertinent
        const addText=line.items.filter(i=>!/^(REF|RUM|SDD|IBAN|BIC|ref|n°)/i.test(i.text)).map(i=>i.text).join(' ').trim();
        if(addText && curTx.label.length<60) curTx.label=(curTx.label+' '+addText).trim().slice(0,60);
      }
    }
  }
  if(curTx&&curTx.label&&curTx.amount) rows.push(curTx);

  // Filtrer les lignes sans montant et les entrées parasites
  return rows.filter(r=>r.amount>0&&r.label.length>1&&!r.label.match(/^(SOLDE|TAEG|TVA|Montant|Date|Page)/i));
}

function guessCategory(label){
  const l=(label||'').toLowerCase();
  if(/carrefour|leclerc|aldi|lidl|monoprix|intermarche|casino|franprix|super u|biocoop|picard|naturalia|boulangerie|boucherie|marche|epicerie/.test(l)) return 'Alimentation';
  if(/restaurant|mcdo|mcdonald|burger|kfc|quick|sushi|pizza|kebab|uber eat|deliveroo|just eat|brasserie|cafe|snack|traiteur|patisserie|glacier/.test(l)) return 'Sorties / loisirs';
  if(/cinema|theatre|concert|musee|sport|gym|piscine|steam|playstation|xbox|nintendo|fnac|cultura|loisir/.test(l)) return 'Sorties / loisirs';
  if(/amazon|ebay|zara|h&m|shein|vinted|aliexpress|cdiscount|galeries|primark|kiabi|decathlon|ikea|leroy|bricoman|boutique/.test(l)) return 'Shopping';
  if(/uber|taxi|sncf|ratp|transilien|ter |blablacar|autoroute|vinci|sanef|parking|peage|essence|total|bp|shell|esso|carburant/.test(l)) return 'Transport';
  if(/pharmacie|medecin|docteur|hopital|clinique|dentiste|kine|optique|opticien|sante|mutuelle|maternite/.test(l)) return 'Sante';
  if(/loyer|edf|engie|eau |internet|sfr|orange|bouygues|free|assurance|allianz|axa|maif|credit|caution/.test(l)) return 'Maison';
  if(/netflix|spotify|disney|prime|youtube|apple|google|deezer|canal|abonnement|mensuel|souscription/.test(l)) return 'Abonnements';
  return 'Autre';
}

function guessCreditCategory(label){
  const l=(label||'').toLowerCase();
  if(/salaire|paie|virement|remuneration|mensuel|traitement|net a payer/.test(l)) return 'Salaire';
  if(/remboursement|rembours|regularisation|avoir|credit/.test(l)) return 'Remboursement';
  if(/caf|allocation|aide|prime|indemnite|chomage|retraite|pension/.test(l)) return 'Aides / allocations';
  return 'Autre entree';
}

function renderImportPreview(){
  const preview=document.getElementById('import-preview');
  const active=importRows.filter(r=>!r.skip);
  const debits=active.filter(r=>r.isDebit);
  const credits=active.filter(r=>!r.isDebit);
  preview.innerHTML=`
    <div style="display:flex;gap:8px;margin:12px 0;font-size:13px;">
      <div style="flex:1;background:var(--red-bg);border-radius:8px;padding:10px;text-align:center;">
        <div style="font-weight:700;color:var(--red);">${debits.length} depenses</div>
        <div style="color:var(--ink2);">${fmt(debits.reduce((s,r)=>s+r.editAmount,0))}</div>
      </div>
      <div style="flex:1;background:var(--green-bg);border-radius:8px;padding:10px;text-align:center;">
        <div style="font-weight:700;color:var(--green);">${credits.length} recettes</div>
        <div style="color:var(--ink2);">${fmt(credits.reduce((s,r)=>s+r.editAmount,0))}</div>
      </div>
    </div>
    <p style="font-size:12px;color:var(--ink2);margin:0 0 10px;">Clique <b>Skip</b> pour ignorer une ligne. Tu peux modifier le libelle, montant et categorie de chaque transaction.</p>
    <div id="import-rows-container">${importRows.map((r,i)=>renderImportRow(r,i)).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button class="import-btn" id="import-confirm-btn" onclick="confirmImport()" style="flex:2;">Importer ${active.length} transactions</button>
      <button onclick="importRows.forEach(r=>r.skip=false);renderImportPreview();" style="flex:1;background:var(--bg);color:var(--ink2);border:0.5px solid var(--line);border-radius:10px;padding:12px;font-size:13px;cursor:pointer;">Tout selectionner</button>
    </div>`;
}

function renderImportRow(r,i){
  return `<div id="irow-${i}" style="display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:${r.skip?'var(--line)':'var(--bg)'};border-radius:10px;margin-bottom:6px;opacity:${r.skip?0.4:1};">
    <div style="display:flex;gap:6px;align-items:center;">
      <span style="font-size:10px;color:var(--ink3);flex-shrink:0;min-width:52px;">${r.date}</span>
      <input type="text" value="${(r.editLabel||'').replace(/"/g,'&quot;')}"
        oninput="importRows[${i}].editLabel=this.value"
        style="flex:1;min-width:0;border:0.5px solid var(--line);border-radius:6px;padding:5px 7px;font-size:12.5px;background:var(--card);color:var(--ink);">
      <span class="tag ${r.isDebit?'debit':'credit'}" style="flex-shrink:0;cursor:pointer;user-select:none;" onclick="toggleImportType(${i})" title="Cliquer pour changer">${r.isDebit?'-':'+'}</span>
      <input type="number" step="0.01" value="${r.editAmount}"
        oninput="importRows[${i}].editAmount=parseFloat(this.value)||0;refreshImportSummary();"
        style="width:75px;flex-shrink:0;border:0.5px solid var(--line);border-radius:6px;padding:5px 6px;font-size:12.5px;text-align:right;background:var(--card);color:${r.isDebit?'var(--red)':'var(--green)'};">
      <button onclick="toggleImportRow(${i})" style="flex-shrink:0;background:${r.skip?'var(--green-bg)':'var(--red-bg)'};color:${r.skip?'var(--green)':'var(--red)'};border:none;border-radius:6px;padding:5px 8px;cursor:pointer;font-size:12px;font-weight:600;">${r.skip?'OK':'Skip'}</button>
    </div>
    <div style="display:flex;gap:6px;align-items:center;padding-left:58px;">
      <select onchange="importRows[${i}].categorie=this.value" style="flex:1;border:0.5px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;background:var(--card);color:var(--ink2);">
        ${[...CATEGORIES,'Salaire','Remboursement','Aides / allocations','Autre entree'].map(c=>`<option value="${c}" ${r.categorie===c?'selected':''}>${c}</option>`).join('')}
        <option value="" ${!r.categorie?'selected':''}>Sans categorie</option>
      </select>
      <span style="font-size:11px;color:var(--ink3);flex-shrink:0;">${r.isDebit?'CB':'Recettes'}</span>
    </div>
  </div>`;
}

function toggleImportRow(i){
  importRows[i].skip=!importRows[i].skip;
  const el=document.getElementById('irow-'+i);
  if(el){ el.style.opacity=importRows[i].skip?'0.4':'1'; el.style.background=importRows[i].skip?'var(--line)':'var(--bg)'; }
  const btn=el?el.querySelector('button'):null;
  if(btn){ btn.textContent=importRows[i].skip?'OK':'Skip'; btn.style.background=importRows[i].skip?'var(--green-bg)':'var(--red-bg)'; btn.style.color=importRows[i].skip?'var(--green)':'var(--red)'; }
  refreshImportSummary();
}

function toggleImportType(i){
  importRows[i].isDebit=!importRows[i].isDebit;
  const el=document.getElementById('irow-'+i);
  const span=el?el.querySelector('.tag'):null;
  if(span){ span.textContent=importRows[i].isDebit?'-':'+'; span.className='tag '+(importRows[i].isDebit?'debit':'credit'); }
}

function refreshImportSummary(){
  const active=importRows.filter(r=>!r.skip);
  const btn=document.getElementById('import-confirm-btn');
  if(btn) btn.textContent=`Importer ${active.length} transactions`;
}

function confirmImport(){
  importRows.filter(r=>!r.skip).forEach(r=>{
    if(r.isDebit) months[currentKey].cb.push({label:r.editLabel.slice(0,50), montant:r.editAmount, categorie:r.categorie||'Autre', note:r.date});
    else months[currentKey].revenus.push({label:r.editLabel.slice(0,50), montant:r.editAmount});
  });
  save();
  document.getElementById('import-modal').remove();
  render();
}


function setGoal(){
  const val=parseFloat(document.getElementById('goal-input').value)||0;
  savingsGoal=val; saveSettings(); render();
}
</script>
</body>
</html>
